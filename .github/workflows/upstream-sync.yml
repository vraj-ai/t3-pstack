name: Upstream sync

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  # Runs upstream's code (bun install, the generator, the tests) with a
  # read-only token. The merged history leaves this job only as a git bundle.
  merge:
    name: Merge chhoumann/t3-pstack and run the checks
    if: github.repository == 'vraj-ai/t3-pstack'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Merge and verify
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export SYNC_REPORT="$RUNNER_TEMP/report/fork-sync-report.md"
          mkdir -p "$RUNNER_TEMP/report" "$RUNNER_TEMP/bundle"
          start="$(git rev-parse HEAD)"
          bash tools/fork-sync.sh
          if [ "$(git rev-parse HEAD)" = "$start" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git bundle create "$RUNNER_TEMP/bundle/sync.bundle" "$start..main"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.sync.outputs.changed == 'true'
        with:
          name: sync-bundle
          path: ${{ runner.temp }}/bundle/sync.bundle
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: sync-report
          path: ${{ runner.temp }}/report/
          retention-days: 14

  # Holds the write token and runs no code from the repo: it fetches the
  # bundle, refuses history that does not extend main, then pushes and tags.
  # A push from this token starts no other workflow, so the merge job's
  # checks are the gate. A merge that touches .github/workflows fails to push,
  # because the token has no workflows scope, and the report job opens an issue.
  publish:
    name: Push main and tag the release
    needs: merge
    if: needs.merge.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sync-bundle
          path: ${{ runner.temp }}/bundle
      - name: Push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q "$RUNNER_TEMP/bundle/sync.bundle" main
          git merge-base --is-ancestor HEAD FETCH_HEAD || { echo "FAIL: the bundle does not extend main" >&2; exit 1; }
          version="$(git show FETCH_HEAD:VERSION)"
          [[ "$version" =~ ^[0-9A-Za-z.-]+$ ]] || { echo "FAIL: VERSION is not a version: $version" >&2; exit 1; }
          gh auth setup-git
          git push origin FETCH_HEAD:refs/heads/main
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            git tag "v$version" FETCH_HEAD
            git push origin "refs/tags/v$version"
          fi

  report:
    name: Open or update the sync issue
    needs: [merge, publish]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: sync-report
          path: ${{ runner.temp }}/report
      - name: File the report
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report="$RUNNER_TEMP/report/fork-sync-report.md"
          title="Upstream sync needs a fix"
          [ -s "$report" ] || { mkdir -p "$RUNNER_TEMP/report"; echo "The sync failed without a report, likely in the push. See the run." > "$report"; }
          printf '\n\nRun: %s\n' "$RUN_URL" >> "$report"
          open="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file "$report"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$report"
          fi
