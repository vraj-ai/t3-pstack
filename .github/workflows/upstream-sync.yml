name: Upstream sync

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  # Runs upstream's code (bun install, the generator, the tests) with a
  # read-only token, as a fast first gate. The merged history leaves this job
  # only as a git bundle.
  merge:
    name: Merge chhoumann/t3-pstack and run the fast checks
    if: github.repository == 'vraj-ai/t3-pstack'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Merge and verify
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export SYNC_REPORT="$RUNNER_TEMP/report/fork-sync-report.md"
          mkdir -p "$RUNNER_TEMP/report" "$RUNNER_TEMP/bundle"
          start="$(git rev-parse HEAD)"
          bash tools/fork-sync.sh
          if [ "$(git rev-parse HEAD)" = "$start" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git bundle create "$RUNNER_TEMP/bundle/sync.bundle" "$start..main"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.sync.outputs.changed == 'true'
        with:
          name: sync-bundle
          path: ${{ runner.temp }}/bundle/sync.bundle
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: sync-report
          path: ${{ runner.temp }}/report/
          retention-days: 14

  # Holds the write token and checks nothing out: a bare repository fetches
  # main and the bundle, so no upstream file is ever on disk beside the token.
  # It pushes the merge to sync/upstream, dispatches the full CI and Security
  # workflows on it (a push from this token starts no workflow, but a dispatch
  # does), and moves main only when both pass. Every successful run also makes
  # sure main's release tag exists, so a failed tag push is retried.
  publish:
    name: Run full CI on the merge, then push main and tag it
    needs: merge
    if: needs.merge.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # Pushes the merged main and, when main moves, its release tag
      actions: write   # Dispatches CI and Security on sync/upstream, then watches them
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.merge.outputs.changed == 'true'
        with:
          name: sync-bundle
          path: ${{ runner.temp }}/bundle
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ needs.merge.outputs.changed }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git init -q --bare "$RUNNER_TEMP/repo"
          cd "$RUNNER_TEMP/repo"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch -q origin +refs/heads/main:refs/remotes/origin/main
          target=refs/remotes/origin/main
          if [ "$CHANGED" = "true" ]; then
            git fetch -q "$RUNNER_TEMP/bundle/sync.bundle" +refs/heads/main:refs/sync/main
            git merge-base --is-ancestor origin/main refs/sync/main || { echo "FAIL: the bundle does not extend main" >&2; exit 1; }
            sha="$(git rev-parse refs/sync/main)"
            git push -q --force origin refs/sync/main:refs/heads/sync/upstream
            for wf in ci.yml security.yml; do gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref sync/upstream; done
            for wf in ci.yml security.yml; do
              id=""
              for _ in $(seq 60); do
                id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --branch sync/upstream --event workflow_dispatch --json databaseId,headSha --jq ".[] | select(.headSha == \"$sha\") | .databaseId" | head -n 1)"
                [ -n "$id" ] && break
                sleep 10
              done
              [ -n "$id" ] || { echo "FAIL: no $wf run started for $sha" >&2; exit 1; }
              gh run watch "$id" --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status > /dev/null || { echo "FAIL: $wf failed on $sha: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id" >&2; exit 1; }
            done
            git push -q origin refs/sync/main:refs/heads/main
            target=refs/sync/main
          fi
          version="$(git show "$target:VERSION")"
          [[ "$version" =~ ^[0-9A-Za-z.-]+$ ]] || { echo "FAIL: VERSION is not a version: $version" >&2; exit 1; }
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            git tag "v$version" "$target"
            git push -q origin "refs/tags/v$version"
            echo "tagged v$version"
          fi

  report:
    name: Open or update the sync issue
    needs: [merge, publish]
    if: always() && (needs.merge.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write  # Opens or comments on the "Upstream sync needs a fix" issue
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: sync-report
          path: ${{ runner.temp }}/report
      - name: File the report
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MERGE_RESULT: ${{ needs.merge.result }}
        run: |
          report="$RUNNER_TEMP/report/fork-sync-report.md"
          title="Upstream sync needs a fix"
          # A report normally arrives from the merge job. Without one, name the
          # job that failed: merge wrote none, or publish failed before the
          # step that would have. Publish is skipped when merge fails.
          if [ ! -s "$report" ]; then
            mkdir -p "$RUNNER_TEMP/report"
            if [ "$MERGE_RESULT" = "failure" ]; then
              echo "The merge job failed before it could write a report: the merge into main, or the checks on it, did not finish. See the run for the failing step." > "$report"
            else
              echo "The publish job failed: a full CI or Security run on sync/upstream failed, or the push or tag did. See the run." > "$report"
            fi
          fi
          printf '\n\nRun: %s\n' "$RUN_URL" >> "$report"
          open="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file "$report"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$report"
          fi
